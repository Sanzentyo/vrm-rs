name: CI

on:
  workflow_dispatch:
    inputs:
      run_external_fixtures:
        description: Download external fixtures, generate three-vrm goldens, and run ignored parity tests.
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --workspace --all-features --summary-only --fail-under-lines 70

  external-fixtures:
    name: External fixture parity
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_external_fixtures }}
    needs: test
    runs-on: ubuntu-latest
    env:
      FIXTURE_DIR: ${{ github.workspace }}/.external-fixtures/official
      GOLDEN_DIR: ${{ github.workspace }}/.external-fixtures/golden
      THREE_VRM_ROOT: ${{ github.workspace }}/.external-fixtures/three-vrm
      THREE_VRM_COMMIT: 9d125586f6d7da094b0ac5f204cebf19586f2397
      VRM_SPEC_COMMIT: 3942748efbc803b258e288e0f6c993c6bb96cebf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2

      - name: Download external fixtures for CI-only parity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$FIXTURE_DIR" "$GOLDEN_DIR"
          curl -fL "https://raw.githubusercontent.com/vrm-c/vrm-specification/${VRM_SPEC_COMMIT}/samples/Seed-san/vrm/Seed-san.vrm" \
            -o "$FIXTURE_DIR/Seed-san.vrm"
          curl -fL "https://raw.githubusercontent.com/vrm-c/vrm-specification/${VRM_SPEC_COMMIT}/samples/VRM1_Constraint_Twist_Sample/vrm/VRM1_Constraint_Twist_Sample.vrm" \
            -o "$FIXTURE_DIR/VRM1_Constraint_Twist_Sample.vrm"
          curl -fL "https://raw.githubusercontent.com/vrm-c/vrm-specification/${VRM_SPEC_COMMIT}/samples/VRMC_materials_mtoon_UV_Animation_Test/vrm/VRMC_materials_mtoon_UV_Animation_Test.vrm" \
            -o "$FIXTURE_DIR/VRMC_materials_mtoon_UV_Animation_Test.vrm"
          curl -fL "https://raw.githubusercontent.com/vrm-c/vrm-specification/${VRM_SPEC_COMMIT}/samples/VRMC_vrm_expressions_isBinary_Overridden/vrm/VRMC_vrm_expressions_isBinary_Overridden.vrm" \
            -o "$FIXTURE_DIR/VRMC_vrm_expressions_isBinary_Overridden.vrm"
          curl -fL "https://raw.githubusercontent.com/vrm-c/vrm-specification/${VRM_SPEC_COMMIT}/samples/VRMC_vrm_expressions_isBinary_Overrides/vrm/VRMC_vrm_expressions_isBinary_Overrides.vrm" \
            -o "$FIXTURE_DIR/VRMC_vrm_expressions_isBinary_Overrides.vrm"
          curl -fL "https://raw.githubusercontent.com/pixiv/three-vrm/${THREE_VRM_COMMIT}/packages/three-vrm-animation/examples/models/test.vrma" \
            -o "$FIXTURE_DIR/test.vrma"

      - name: Build pinned three-vrm for golden generation
        shell: bash
        run: |
          set -euxo pipefail
          git init "$THREE_VRM_ROOT"
          git -C "$THREE_VRM_ROOT" remote add origin https://github.com/pixiv/three-vrm.git
          git -C "$THREE_VRM_ROOT" fetch --depth 1 origin "$THREE_VRM_COMMIT"
          git -C "$THREE_VRM_ROOT" checkout --detach FETCH_HEAD
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm -C "$THREE_VRM_ROOT" install --frozen-lockfile
          pnpm -C "$THREE_VRM_ROOT" --filter @pixiv/three-vrm-springbone --filter @pixiv/three-vrm-core --filter @pixiv/three-vrm-materials-mtoon --filter @pixiv/three-vrm-materials-hdr-emissive-multiplier --filter @pixiv/three-vrm-materials-v0compat --filter @pixiv/three-vrm-node-constraint --filter @pixiv/three-vrm --filter @pixiv/three-vrm-animation build

      - name: Generate three-vrm golden outputs
        shell: bash
        run: |
          set -euxo pipefail
          node tools/three-vrm-golden.mjs \
            --fixture "$FIXTURE_DIR/Seed-san.vrm" \
            --three-vrm-root "$THREE_VRM_ROOT" \
            --frames 8 \
            --out "$GOLDEN_DIR/Seed-san.spring.json"
          node tools/three-vrm-golden.mjs \
            --fixture "$FIXTURE_DIR/VRM1_Constraint_Twist_Sample.vrm" \
            --three-vrm-root "$THREE_VRM_ROOT" \
            --frames 8 \
            --out "$GOLDEN_DIR/VRM1_Constraint_Twist_Sample.spring.json"
          node tools/three-vrm-constraint-golden.mjs \
            --fixture "$FIXTURE_DIR/VRM1_Constraint_Twist_Sample.vrm" \
            --three-vrm-root "$THREE_VRM_ROOT" \
            --out "$GOLDEN_DIR/VRM1_Constraint_Twist_Sample.constraint.json"
          node tools/three-vrm-vrma-golden.mjs \
            --fixture "$FIXTURE_DIR/Seed-san.vrm" \
            --vrma "$FIXTURE_DIR/test.vrma" \
            --three-vrm-root "$THREE_VRM_ROOT" \
            --times 0,0.5,1 \
            --out "$GOLDEN_DIR/Seed-san.test-vrma.json"
          node tools/three-vrm-vrma-golden.mjs \
            --fixture "$FIXTURE_DIR/Seed-san.vrm" \
            --vrma "$FIXTURE_DIR/test.vrma" \
            --three-vrm-root "$THREE_VRM_ROOT" \
            --times 0,0.125,0.25,0.375,0.5,0.625,0.75,0.875,1 \
            --out "$GOLDEN_DIR/Seed-san.test-vrma-dense.json"

      - name: Run ignored external fixture tests
        shell: bash
        run: |
          set -euxo pipefail
          VRM_RS_FIXTURE_DIR="$FIXTURE_DIR" \
            cargo test -p vrm-io tests::loads_external_fixture_directory -- --ignored --exact
          VRM_RS_THREE_VRM_GOLDEN="$GOLDEN_DIR/Seed-san.spring.json" \
            cargo test -p vrm-adapter tests::spring_parity_matches_three_vrm_golden_rotations -- --ignored --exact
          VRM_RS_THREE_VRM_GOLDEN_DIR="$GOLDEN_DIR" \
            cargo test -p vrm-adapter tests::spring_parity_matches_three_vrm_golden_directory -- --ignored --exact
          VRM_RS_THREE_VRM_CONSTRAINT_GOLDEN="$GOLDEN_DIR/VRM1_Constraint_Twist_Sample.constraint.json" \
            cargo test -p vrm-adapter tests::node_constraint_manager_matches_three_vrm_golden -- --ignored --exact
          VRM_RS_THREE_VRM_VRMA_GOLDEN="$GOLDEN_DIR/Seed-san.test-vrma.json" \
            cargo test -p vrm-adapter tests::vrma_application_matches_three_vrm_golden -- --ignored --exact
          VRM_RS_THREE_VRM_VRMA_GOLDEN_DIR="$GOLDEN_DIR" \
            cargo test -p vrm-adapter tests::vrma_application_matches_three_vrm_golden_directory -- --ignored --exact

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-fixture-goldens
          path: .external-fixtures/golden/
          if-no-files-found: ignore
