[package]
name = "vrm-rs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Renderer-agnostic Rust toolkit for reading and driving VRM/VRMA assets."

[workspace]
members = [
    ".",
    "crates/vrm-adapter",
    "crates/vrm-adapter-bevy",
    "crates/vrm-core",
    "crates/vrm-io",
    "crates/vrm-protocol",
    "crates/vrm-runtime",
    "crates/vrm-sans-io",
]
resolver = "3"

[workspace.dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
bitflags = "2.11.1"
crossbeam-channel = "0.5.15"
glam = "0.32.1"
gltf = { version = "1.4.1", features = ["extensions"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
indexmap = { version = "2.14.0", features = ["serde"] }
pollster = "0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
thiserror = "2.0.18"
bevy = { version = "0.18.1", default-features = false, features = ["bevy_asset"] }
wgpu = "29.0.3"

[dependencies]
vrm-adapter = { path = "crates/vrm-adapter" }
vrm-core = { path = "crates/vrm-core" }
vrm-io = { path = "crates/vrm-io" }
vrm-protocol = { path = "crates/vrm-protocol" }
vrm-runtime = { path = "crates/vrm-runtime" }
vrm-sans-io = { path = "crates/vrm-sans-io" }

[dev-dependencies]
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_light",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_shader",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "png",
    "reflect_auto_register",
    "tonemapping_luts",
    "zstd_rust",
] }
bytemuck.workspace = true
crossbeam-channel.workspace = true
glam.workspace = true
image.workspace = true
pollster.workspace = true
serde_json.workspace = true
vrm-adapter-bevy = { path = "crates/vrm-adapter-bevy" }
wgpu.workspace = true
