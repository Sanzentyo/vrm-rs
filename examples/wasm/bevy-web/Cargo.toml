[package]
name = "vrm-rs-bevy-web"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_light",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_shader",
    "bevy_window",
    "bevy_winit",
    "png",
    "reflect_auto_register",
    "tonemapping_luts",
    "webgpu",
    "zstd_rust",
] }
console_error_panic_hook = "0.1.7"
vrm-adapter-bevy = { path = "../../../crates/vrm-adapter-bevy", features = ["render"] }
vrm-io = { path = "../../../crates/vrm-io" }
wasm-bindgen = "0.2.125"
